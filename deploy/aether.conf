# AETHER — landing page (/) + discovery registry API (/api/)
# Public URL: https://bb3c19ff4.abacusai.cloud  ->  server_name bb3c19ff4.vm.internal
server {
    listen 80;
    server_name bb3c19ff4.vm.internal;

    # Embeddable in the apps.abacus.ai iframe preview.
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai" always;
    add_header Cache-Control "max-age=0, s-maxage=60";

    # Landing page (static).
    location = / {
        root /home/ubuntu/aether_protocol/site;
        try_files /index.html =404;
    }

    # Registry API — strips the /api/ prefix so client paths map to /publish etc.
    location /api/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $http_x_original_host;
        proxy_http_version 1.1;
    }

    location / {
        root /home/ubuntu/aether_protocol/site;
        try_files $uri $uri/ =404;
    }
}
