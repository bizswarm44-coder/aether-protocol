[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-protocol"
version = "1.0.0"
description = "AETHER — a lightweight, signed protocol for agent-to-agent discovery, negotiation, task exchange, and settlement."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "AETHER Protocol" }]
keywords = ["ai-agents", "protocol", "payments", "settlement", "cryptography"]
dependencies = ["cryptography>=3.4"]

# The core library and the discovery registry client are zero-extra-dependency
# (standard library only). The optional "registry" extra is reserved for future
# server enhancements; the reference server runs on the standard library alone.
[project.optional-dependencies]
registry = []
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/aether-protocol/aether"

[tool.setuptools]
packages = ["aether", "registry"]
